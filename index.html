<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ofgxUbwUQYEK99kFVUSJZoSPpsnA2qtM9RixZ60aEi4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تمرین</title>
<meta name="theme-color" content="#23282D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تمرین">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/IRANSansX-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/IRANSansX-ExtraBold.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"IRANSansX";src:url(fonts/IRANSansX-Regular.woff) format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansX";src:url(fonts/IRANSansX-Medium.woff) format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansX";src:url(fonts/IRANSansX-Bold.woff) format("woff");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansX";src:url(fonts/IRANSansX-ExtraBold.woff) format("woff");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"IRANSansX";src:url(fonts/IRANSansX-ExtraBlack.woff) format("woff");font-weight:950;font-style:normal;font-display:swap}
:root{
  --rubber:#23282D; --mat:#2D3338; --mat2:#363D43; --line:#3E464D;
  --steel:#9CA5AC; --chalk:#F2F1EB; --hole:#1B1F23;
  --c:#F2F1EB; --on:#1B1F23;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{background:var(--rubber);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--chalk);font-family:"IRANSansX",system-ui,-apple-system,"SF Arabic","Geeza Pro",Tahoma,sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--chalk);outline-offset:3px;border-radius:6px}
h1,h2,h3,p{margin:0}
.disp{font-weight:950;line-height:1.3;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 160px)}

/* weight plate: hole, steel hub, groove, coloured rubber, darker rim */
.plate{--s:120px;width:var(--s);height:var(--s);flex:none;border-radius:50%;
  background:
    radial-gradient(circle,var(--hole) 0 12%,#CDD2D6 12.6% 18.4%,#7D868D 18.9% 20.4%,transparent 20.9%),
    radial-gradient(circle,transparent 0 63%,rgba(0,0,0,.2) 63.5% 65.5%,transparent 66%),
    var(--c);
  box-shadow:inset 0 0 0 calc(var(--s)*.05) color-mix(in srgb,var(--c) 74%,#000)}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-size:30px}
.wk{color:var(--steel);font-size:14px}

.hero{display:flex;gap:20px;align-items:center;margin-top:14px;padding:18px 0 24px;border-bottom:1px solid var(--line)}
.hero{flex-wrap:wrap}
.hero .plate{--s:126px}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;margin-top:4px}
.strip img,.strip i{display:block;width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--mat)}
.strip i{box-shadow:inset 0 0 0 1.5px var(--line)}
.hero .kick{color:var(--steel);font-size:14px}
.sname{font-size:38px}
.meta{color:var(--steel);font-size:14.5px;line-height:1.65}
.hero .meta{margin:2px 0 14px}
.last{color:var(--steel);font-size:14px;margin-top:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 26px;border-radius:999px;background:var(--c);color:var(--on);font-weight:800;font-size:16.5px}
.btn.wide{display:flex;width:100%}
.btn.line{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:scale(.98)}

.sec{margin:30px 0 2px;font-size:15px;color:var(--steel);font-weight:700}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row .plate{--s:42px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px;font-weight:800;line-height:1.5}
.row .t small{display:block;font-size:13.5px;color:var(--steel);line-height:1.55}
.chev{width:20px;height:20px;flex:none;color:var(--steel)}
.pill{display:inline-block;margin-inline-start:8px;padding:0 9px;border-radius:999px;background:var(--c);color:var(--on);font-size:12px;font-weight:800;line-height:1.75;vertical-align:2px}

.nav{display:flex;align-items:center;min-height:42px}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:42px;color:var(--steel);font-size:15px;font-weight:700}
.backbtn svg{width:20px;height:20px}
.shead{display:flex;align-items:center;gap:16px;margin:8px 0 10px}
.shead .plate{--s:66px}
.shead .sname{font-size:34px}

.exlist{list-style:none;margin:0;padding:0}
.ex{display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.media{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--mat)}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--mat)}
.num{position:absolute;top:8px;inset-inline-start:8px;min-width:28px;height:28px;padding:0 7px;border-radius:999px;background:rgba(27,31,35,.84);display:grid;place-items:center;font-size:14.5px;font-weight:800;line-height:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--steel);font-size:12.5px;line-height:1.4;text-align:center;padding:10px}
.ph i{display:block;width:46%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--line);box-shadow:inset 0 0 0 14px var(--mat),inset 0 0 0 17px var(--line)}
.info h3{font-size:16.5px;font-weight:800;line-height:1.5}
.info h3 button{display:block;width:100%}
.en{font-size:12.5px;color:var(--steel);line-height:1.45}
.dose{margin-top:6px;font-size:14.5px;line-height:1.6}
.dose small{display:block;color:var(--steel);font-size:13.5px}
.sets{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.set{width:36px;height:36px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--c)}
.set.done{background:radial-gradient(circle,var(--rubber) 0 18%,var(--c) 20%)}
.wt{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--steel)}
.wt input{width:70px;min-height:40px;padding:4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--mat);color:var(--chalk);font:inherit;font-size:16px;text-align:center}
.mini{display:inline-flex;align-items:center;min-height:38px;margin-top:10px;padding:4px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:700}

.endrow{margin-top:8px}
.finish{margin-top:24px}

/* exercise sheet */
#sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--rubber);visibility:hidden;transform:translateY(103%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
#sheet.open{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sh{max-width:560px;margin:0 auto;padding:calc(var(--st) + 8px) 18px calc(var(--sb) + 160px)}
.shbar{display:flex;justify-content:flex-end;min-height:46px;align-items:center}
.close{min-height:42px;padding:0 4px;color:var(--steel);font-weight:700;font-size:15px}
.sh .media{border-radius:20px}
.media svg.rig{position:absolute;inset:0;width:100%;height:100%}
.strip .sv{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--mat)}
.strip .sv svg{position:absolute;inset:0;width:100%;height:100%}
.strip-l{width:100%;margin-top:6px;color:var(--steel);font-size:13.5px}
.rg-near{stroke:var(--chalk);fill:none;stroke-linecap:round;stroke-linejoin:round}
.rg-far{stroke:#7F8990;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rg-head{fill:var(--chalk)}
.rg-eq{stroke:#4A535A;fill:none;stroke-linecap:round}
.rg-bench{fill:#3A4248}
.rg-mat{stroke:#3A4248;fill:#3A4248;stroke-linecap:round}
.rg-cable{stroke:var(--steel);fill:none}
.rg-acc{stroke:var(--c);fill:var(--c);stroke-linecap:round}
.rg-nose{stroke:var(--rubber);stroke-linecap:round}
.vnote{margin-top:12px;padding-inline-start:12px;box-shadow:inset -2px 0 0 var(--c);color:var(--steel);font-size:13.5px;line-height:1.6}
.sh h2{margin-top:16px;font-size:24px;font-weight:800;line-height:1.45}
.sh .dose{font-size:16px}
.sh h3{margin-top:20px;font-size:15px;color:var(--steel);font-weight:700}
.cues{margin:6px 0 0;padding-inline-start:20px}
.cues li{margin:5px 0}
.alt{margin-top:14px;font-size:14.5px;color:var(--steel)}
.alt b{color:var(--chalk);font-weight:700}
.sh .sets{gap:12px;margin-top:14px}
.sh .set{width:46px;height:46px}
.sh .btn.wide{margin-top:22px}

/* timer */
#timer{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(var(--sb) + 76px);max-width:536px;margin:0 auto;display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:var(--mat2);box-shadow:0 14px 36px rgba(0,0,0,.42);overflow:hidden}
#timer.show{display:flex}
#timer .prog{position:absolute;top:0;right:0;left:0;height:4px;background:var(--c);transform-origin:right center}
#timer .tt{flex:1;min-width:0}
#timer .lbl{font-size:13.5px;color:var(--steel);line-height:1.35}
#timer .clock{font-size:36px;line-height:1.05;direction:ltr;unicode-bidi:isolate;text-align:right}
#timer .tb{min-height:42px;padding:0 14px;border-radius:999px;background:var(--mat);font-size:14px;font-weight:700;white-space:nowrap}
#timer.done{background:var(--c);color:var(--on)}
#timer.done .lbl{color:inherit;opacity:.85}
#timer.done .tb{background:rgba(0,0,0,.14)}

/* tabs */
#tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(var(--sb) + 4px);background:rgba(35,40,45,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:6px 0 2px;color:var(--steel);font-size:12.5px;font-weight:700;text-align:center}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--chalk)}

#toast{position:fixed;z-index:50;left:16px;right:16px;top:calc(var(--st) + 12px);max-width:528px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--chalk);color:var(--hole);font-weight:700;font-size:15px;line-height:1.6;transform:translateY(-160%);transition:transform .25s ease}
#toast.show{transform:none}

/* reading pages */
.ptitle{font-size:32px}
.lead{margin-top:4px;color:var(--steel);font-size:15px}
.dl{margin:16px 0 0;border-top:1px solid var(--line)}
.dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dl dt{color:var(--steel);font-size:15px}
.dl dd{margin:0;font-weight:800;font-size:17px;text-align:left}
.meal{padding:16px 0;border-bottom:1px solid var(--line)}
.meal h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:18px;font-weight:800}
.meal h3 small{color:var(--steel);font-size:13px;font-weight:500;white-space:nowrap}
.meal p{margin-top:6px}
.meal .or{margin-top:8px;color:var(--steel);font-size:14.5px}
.meal .or b{color:var(--chalk);font-weight:700}
.prose h2{margin:32px 0 6px;font-size:20px;font-weight:800;line-height:1.5}
.prose p{margin:6px 0}
.prose ul{margin:6px 0;padding-inline-start:20px}
.prose li{margin:6px 0}
.note{color:var(--steel);font-size:14px}
.warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--mat);box-shadow:inset 3px 0 0 #D7263D}
table.wk3{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
table.wk3 th,table.wk3 td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.wk3 th{color:var(--steel);font-weight:700;font-size:13.5px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;gap:8px}
.stepper button{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-size:22px;font-weight:700;display:grid;place-items:center}
.prose .btn{margin-top:14px}
.credits li{font-size:13.5px;color:var(--steel)}
.credits a{color:var(--chalk)}

@media (prefers-reduced-motion:reduce){#sheet,#sheet.open,#toast{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>

<div id="sheet" role="dialog" aria-modal="true" aria-label="جزئیات حرکت"></div>

<div id="timer">
  <span class="prog"></span>
  <div class="tt"><div class="lbl" role="status">استراحت</div><div class="clock disp" aria-hidden="true">۰:۰۰</div></div>
  <button class="tb" data-act="t+" id="tAdd">+۱۵ ثانیه</button>
  <button class="tb" data-act="tskip" id="tSkip">رد کن</button>
</div>

<nav id="tabs" aria-label="بخش‌ها">
  <button class="tab" data-act="tab" data-tab="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.2v5.6M20.5 9.2v5.6M6.5 12h11"/></svg>
    تمرین
  </button>
  <button class="tab" data-act="tab" data-tab="food">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8.2c0-1.4 1-1.9 1-3.3M12.5 8.2c0-1.4 1-1.9 1-3.3"/></svg>
    تغذیه
  </button>
  <button class="tab" data-act="tab" data-tab="guide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h11M4 12h11M4 17.5h11"/><circle cx="19.5" cy="6.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="19.5" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="19.5" cy="17.5" r="1.25" fill="currentColor" stroke="none"/></svg>
    راهنما
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = x => String(x).replace(/[0-9]/g, d => FA[d]);
const DAY = 864e5;
const $ = s => document.querySelector(s);
const app = $('#app'), sheet = $('#sheet'), timerEl = $('#timer'), toastEl = $('#toast');

const PLATE = {
  blue:   ['#2F6FDB', '#FFFFFF'],
  red:    ['#D7263D', '#FFFFFF'],
  yellow: ['#F2C230', '#1B1F23'],
  green:  ['#2F9E5F', '#FFFFFF'],
  white:  ['#E8E7E1', '#1B1F23'],
  gray:   ['#8D979F', '#1B1F23']
};
const pv = p => `--c:${PLATE[p][0]};--on:${PLATE[p][1]}`;

const ICON = {
  fwd: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- videos ---------- */
// Clip files live in v/<name>.mp4 with a poster at v/<name>.jpg.
// Clip files live in v/<name>.mp4 with a poster at v/<name>.jpg; the value is the clip's width / height.
const VIDEOS = {
  'chest-press': 4/3, 'cable-row': 4/3, 'incline-db-press': 1, 'lat-pulldown': 1, 'rope-pushdown': 1, 'db-curl': 1,
  'leg-press': 4/3, 'leg-extension': 1, 'glute-bridge': 4/3, 'calf-raise': 1,
  'db-shoulder-press': 1, 'close-pulldown': 1, 'db-bench': 4/3, 'db-row': 1, 'lateral-raise': 4/3,
  'cat-camel': 4/3, 'side-plank': 16/9, 'treadmill': 4/3, 'bike': 4/3
};
const hasVid = v => !!v && Object.prototype.hasOwnProperty.call(VIDEOS, v);
const PX = (slug, id) => `https://www.pexels.com/video/${slug}-${id}/`;
const MX = id => `https://mixkit.co/free-stock-video/x-${id}/`;
const CREDITS = [
  {fa:'پرس سینه با دستگاه', src:'Mixkit', url:MX(100534)},
  {fa:'روئینگ سیم‌کش نشسته', src:'Mixkit', url:MX(100550)},
  {fa:'پرس بالاسینه با دمبل', src:'Pexels', url:PX('intense-weight-training-on-bench-with-dumbbells', 29569378)},
  {fa:'زیربغل سیم‌کش از جلو', src:'Mixkit', url:MX(100549)},
  {fa:'پشت بازو سیم‌کش', src:'Pexels', url:PX('a-man-working-out-inside-the-gym', 5319433)},
  {fa:'جلو بازو با دمبل', src:'Pexels', url:PX('man-doing-arm-workout-at-gym', 5319426)},
  {fa:'پرس پا', src:'Pexels', url:PX('lifting-heavy-weights', 17189849)},
  {fa:'جلو پا با دستگاه', src:'Pexels', url:PX('gym-workout-motivation-with-leg-extensions', 32709558)},
  {fa:'پل باسن', src:'Pexels', url:PX('man-working-out-at-the-park', 6022668)},
  {fa:'ساق پا', src:'Pexels', url:PX('intense-calf-workout-in-gym-setting', 32115656)},
  {fa:'پرس سرشانه با دمبل', src:'Pexels', url:PX('a-man-doing-dumbbell-shoulder-press', 4367541)},
  {fa:'زیربغل سیم‌کش دست‌جمع', src:'Pexels', url:PX('intense-gym-workout-with-lat-pulldown', 40342562)},
  {fa:'پرس سینه با دمبل', src:'Pexels', url:PX('intense-dumbbell-press-workout-in-home-gym', 33261218)},
  {fa:'روئینگ تک‌دست با دمبل', src:'Pexels', url:PX('a-man-working-out-using-dumbbell', 5319429)},
  {fa:'نشر جانب', src:'Pexels', url:PX('a-man-working-out-using-dumbbell', 5319102)},
  {fa:'گربه و شتر', src:'Pexels', url:PX('a-man-stretching-on-a-yoga-mat', 6298132)},
  {fa:'پلانک پهلو', src:'Pexels', url:PX('a-man-exercising', 6023265)},
  {fa:'تردمیل', src:'Pexels', url:PX('a-man-doing-leg-workout-on-the-treadmill', 4367637)},
  {fa:'دوچرخهٔ ثابت', src:'Pexels', url:PX('a-person-riding-an-exercise-bike-in-a-gym', 27861390)}
];
const APP_VERSION = '۱٫۱';

/* ---------- program ---------- */

/* ---------- storage (falls back to memory) ---------- */
const mem = {};
const S = {
  get(k, d) {
    if (k in mem) return mem[k];
    try { const v = localStorage.getItem('gym:' + k); if (v !== null) return (mem[k] = JSON.parse(v)); } catch (e) {}
    return d;
  },
  set(k, v) { mem[k] = v; try { localStorage.setItem('gym:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem('gym:' + k); } catch (e) {} }
};

function week() {
  let st = S.get('start', 0);
  if (!st) { st = Date.now(); S.set('start', st); }
  const w = Math.floor((Date.now() - st) / (7 * DAY)) + 1 + S.get('wOff', 0);
  return Math.max(1, w);
}
const setsFor = w => w <= 2 ? 2 : w <= 12 ? 3 : w === 13 ? 2 : 3;
const cardioText = w => w <= 2 ? '۲۰ تا ۳۰ دقیقه' : '۳۰ دقیقه';
const cardioMin = w => w <= 2 ? 20 : 30;

const restText = s => s >= 120 && s % 60 === 0 ? fa(s / 60) + ' دقیقه' : fa(s) + ' ثانیه';

function dayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function setsMap() {
  let m = S.get('sets', null);
  if (!m || m.day !== dayKey()) { m = {day: dayKey(), v: {}}; S.set('sets', m); }
  return m;
}
const getDone = (ctx, id) => setsMap().v[ctx + ':' + id] || 0;
function setDone(ctx, id, n) { const m = setsMap(); m.v[ctx + ':' + id] = n; S.set('sets', m); }

const getW = id => (S.get('w', {})[id] || '');
function normNum(s) {
  return String(s)
    .replace(/[۰-۹]/g, d => FA.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[٫,]/g, '.')
    .replace(/[^0-9.]/g, '')
    .slice(0, 6);
}
function setW(id, val) {
  const w = S.get('w', {}); const v = normNum(val);
  if (v) w[id] = v; else delete w[id];
  S.set('w', w); return v;
}

const hist = () => S.get('hist', []);
function nextSid() {
  const h = hist(); if (!h.length) return ORDER[0];
  const i = ORDER.indexOf(h[h.length - 1].s);
  return ORDER[(i + 1) % ORDER.length];
}
function relDays(t) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(t); b.setHours(0, 0, 0, 0);
  const d = Math.round((a - b) / DAY);
  return d <= 0 ? 'امروز' : d === 1 ? 'دیروز' : fa(d) + ' روز پیش';
}

/* Line-figure exercise demos, drawn as SVG and animated from keyframes.
   Side view unless noted; the figure faces right. Units: viewBox 160 x 120, floor at y = 110. */
const RIG = (() => {
  const LEN = {torso: 26, neck: 4, head: 6.6, ua: 17.5, fa: 15, th: 23, sh: 22, ft: 8};
  const rad = d => d * Math.PI / 180;
  const dir = d => [Math.cos(rad(d)), Math.sin(rad(d))];
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // Middle joint of a two-bone limb from its root to its tip; bend = +1 or -1 picks the side.
  function ik(a, c, l1, l2, bend) {
    let dx = c[0] - a[0], dy = c[1] - a[1], d = Math.hypot(dx, dy);
    const max = l1 + l2 - 1e-6;
    if (d > max) { c = [a[0] + dx / d * max, a[1] + dy / d * max]; dx = c[0] - a[0]; dy = c[1] - a[1]; d = max; }
    d = Math.max(d, Math.abs(l1 - l2) + 1e-6);
    const x = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
    const ux = dx / d, uy = dy / d;
    return [[a[0] + ux * x - uy * h * bend, a[1] + uy * x + ux * h * bend], c];
  }

  // Interpolate every number in two poses of the same shape.
  function mix(p, q, t) {
    if (typeof p === 'number') return lerp(p, q, t);
    if (Array.isArray(p)) return p.map((v, i) => mix(v, q[i], t));
    if (p && typeof p === 'object') { const o = {}; for (const k in p) o[k] = k in q ? mix(p[k], q[k], t) : p[k]; return o; }
    return p;
  }
  // keys: [[time, pose], ...] with the last time = loop length; pose at the end should equal the first.
  function sample(keys, t) {
    const T = keys[keys.length - 1][0]; t = ((t % T) + T) % T;
    for (let i = 0; i < keys.length - 1; i++) {
      const [t0, p0] = keys[i], [t1, p1] = keys[i + 1];
      if (t >= t0 && t <= t1) return t1 === t0 ? p1 : mix(p0, p1, ease((t - t0) / (t1 - t0)));
    }
    return keys[0][1];
  }

  /* Pose fields:
     hip [x,y], tor (deg, hip to shoulder), nk (head tilt, deg added to tor)
     arms: wN/wF wrist targets, ebN/ebF elbow bend side
     legs: aN/aF ankle targets, kbN/kbF knee bend side, fN/fF foot angle
     a limb may instead give angles: armN: [ua, fa] or legN: [th, sh]                                   */
  function solve(p) {
    const hip = p.hip, sh = add(hip, dir(p.tor), LEN.torso);
    const neck = add(sh, dir(p.tor + (p.nk || 0)), LEN.neck), head = add(neck, dir(p.tor + (p.nk || 0)), LEN.head);
    const limb = (root, tgt, ang, l1, l2, bend) => {
      if (ang && Array.isArray(ang[0])) return [ang[0], ang[1]];          // explicit joint positions
      if (ang) { const m = add(root, dir(ang[0]), l1); return [m, add(m, dir(ang[1]), l2)]; }
      return ik(root, tgt, l1, l2, bend);
    };
    const [eN, wN] = limb(sh, p.wN, p.armN, LEN.ua, LEN.fa, p.ebN ?? 1);
    const [eF, wF] = limb(sh, p.wF ?? p.wN, p.armF ?? p.armN, LEN.ua, LEN.fa, p.ebF ?? p.ebN ?? 1);
    const [kN, aN] = limb(hip, p.aN, p.legN, LEN.th, LEN.sh, p.kbN ?? -1);
    const [kF, aF] = limb(hip, p.aF ?? p.aN, p.legF, LEN.th, LEN.sh, p.kbF ?? p.kbN ?? -1);
    const tN = add(aN, dir(p.fN ?? 0), LEN.ft), tF = add(aF, dir(p.fF ?? p.fN ?? 0), LEN.ft);
    return {hip, sh, head, eN, wN, eF, wF, kN, aN, kF, aF, tN, tF};
  }

  const f = n => n.toFixed(1);
  const line = (a, b, cls, w) => `<path class="${cls}" stroke-width="${w}" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}"/>`;
  const poly = (pts, cls, w) => `<path class="${cls}" stroke-width="${w}" d="M${pts.map(p => f(p[0]) + ' ' + f(p[1])).join('L')}"/>`;
  function figure(j, opt = {}) {
    const far = poly([j.hip, j.kF, j.aF, j.tF], 'rg-far', 5.6) + poly([j.sh, j.eF, j.wF], 'rg-far', 5);
    const near = poly([j.hip, j.kN, j.aN, j.tN], 'rg-near', 5.6) + poly([j.sh, j.eN, j.wN], 'rg-near', 5);
    const body = line(j.hip, j.sh, 'rg-near', 10.5) + `<circle class="rg-head" cx="${f(j.head[0])}" cy="${f(j.head[1])}" r="${LEN.head}"/>`;
    return {far, body, near};
  }
  const floor = (y = 110) => `<path class="rg-eq" stroke-width="1.4" d="M10 ${y + 1.5}H150"/>`;
  const dumbbellSide = (w, ang = 0) => {   // dumbbell held with a neutral grip, seen from the side
    const v = dir(ang), a = add(w, v, -6), b = add(w, v, 6);
    return line(a, b, 'rg-acc', 2.2) + line(add(a, v, -1.5), add(a, v, 1.5), 'rg-acc', 7) + line(add(b, v, -1.5), add(b, v, 1.5), 'rg-acc', 7);
  };

  /* ---------- exercises ---------- */
  const base = (o) => Object.assign({nk: 0, ebN: 1, kbN: -1, fN: 0}, o);
  const X = {};

  // Bird dog: on all fours, reach one arm forward and the opposite leg back, hold, switch.
  {
    const hip = [56, 84.5], tor = -12;
    const s = add(hip, dir(tor), LEN.torso);
    const hand = [s[0] + 1.5, 107.5], ankle = [hip[0] - 21.5, 107.8];
    const P = base({hip, tor, nk: 8, wN: hand, wF: hand, aN: ankle, aF: ankle, kbN: -1, kbF: -1, fN: 180, fF: 180});
    const legBack = [hip[0] - 44.5, hip[1] - 3], armFwd = [s[0] + 32.3, s[1] - 3];
    // reach the knee target: thigh straight down needs the ankle behind the knee on the floor
    const A = Object.assign({}, P, {wN: armFwd, aF: legBack, fF: 95});
    const B = Object.assign({}, P, {wF: armFwd, aN: legBack, fN: 95});
    X['bird-dog'] = {ar: 4 / 3, keys: [[0, P], [1.1, A], [2.6, A], [3.5, P], [4.0, P], [5.1, B], [6.6, B], [7.5, P], [8.0, P]],
      draw: (j) => { const g = figure(j); return floor(108.5) + g.far + g.body + g.near; }};
  }

  // Dead bug: on the back, arms up, hips and knees at 90 degrees; lower opposite arm and leg.
  {
    const hip = [60, 101], tor = 0;
    const s = add(hip, dir(tor), LEN.torso);
    const up = [s[0], s[1] - 32], ank = [hip[0] - 22, hip[1] - 23];
    const P = base({hip, tor, nk: -4, wN: up, wF: up, aN: ank, aF: ank, kbN: 1, kbF: 1, fN: -80, fF: -80, ebN: 1, ebF: 1});
    const armOver = add(s, dir(-7), 32.3), legOut = add(hip, dir(187), 44.6);
    const A = Object.assign({}, P, {wN: armOver, aF: legOut, fF: 200});
    const B = Object.assign({}, P, {wF: armOver, aN: legOut, fN: 200});
    X['dead-bug'] = {ar: 4 / 3, keys: [[0, P], [1.3, A], [1.9, A], [3.1, P], [3.6, P], [4.9, B], [5.5, B], [6.7, P], [7.2, P]],
      draw: (j) => { const g = figure(j); return `<path class="rg-mat" d="M18 107.5H146" stroke-width="5"/>` + g.far + g.body + g.near; }};
  }

  // Half-kneeling hip flexor stretch: back knee down, squeeze the glute, shift the hips forward, reach up.
  {
    const P = base({hip: [57, 84.5], tor: -91, nk: -2, wN: [57, 86], wF: [74, 83], ebN: 1, ebF: 1,
      aN: [32, 107.8], kbN: -1, fN: 180, aF: [87, 108.5], kbF: -1, fF: 0});
    const Q = Object.assign({}, P, {hip: [62, 85.5], tor: -94, wN: [58, 26], ebN: 1, wF: [76, 85]});
    X['hip-flexor'] = {ar: 4 / 3, keys: [[0, P], [1.5, Q], [4.0, Q], [5.4, P], [6.2, P]],
      draw: (j) => { const g = figure(j); return floor() + g.far + g.body + g.near; }};
  }

  // Hip thrust: upper back on a bench, feet flat; drive the hips up until the body is flat, then lower.
  {
    const bench = `<path class="rg-bench" d="M10 80H48V110H10Z"/>`;
    const sh = [47, 77.5];
    const pose = (hip, ankle) => {
      const tor = Math.atan2(sh[1] - hip[1], sh[0] - hip[0]) * 180 / Math.PI;
      return base({hip, tor, nk: 4, wN: [hip[0] + 3, hip[1] - 7], wF: [hip[0] + 3, hip[1] - 7], ebN: -1, ebF: -1,
        aN: ankle, aF: [ankle[0] + 3, ankle[1]], kbN: -1, kbF: -1, fN: 0, fF: 0});
    };
    const at = d => add(sh, dir(d), LEN.torso);
    const lo = pose(at(42), [96, 108.5]), hi = pose(at(-1), [96, 108.5]);
    X['hip-thrust'] = {ar: 4 / 3, keys: [[0, lo], [1.1, hi], [1.9, hi], [3.4, lo], [3.8, lo]],
      draw: (j) => { const g = figure(j); const w = [j.hip[0] + 1, j.hip[1] - 8.5];
        return floor() + bench + g.far + g.body + `<circle class="rg-acc" cx="${f(w[0])}" cy="${f(w[1])}" r="6.5" fill-opacity=".25" stroke-width="2.4"/>` + g.near; }};
  }

  // Cable pull-through: back to a low pulley, rope between the legs; hinge back, then stand by squeezing the glutes.
  {
    const col = `<path class="rg-bench" d="M10 18H22V110H10Z"/>`, pulley = [24, 103];
    const stand = base({hip: [70, 63.5], tor: -87, nk: 0, wN: [73, 71], wF: [73, 71], ebN: 1,
      aN: [69, 108.5], aF: [73, 108.5], kbN: -1, fN: 0, fF: 0});
    const hinge = Object.assign({}, stand, {hip: [57, 67.5], tor: -36, nk: 10, wN: [68, 84], wF: [68, 84]});
    X['pull-through'] = {ar: 4 / 3, keys: [[0, stand], [1.5, hinge], [1.9, hinge], [3.0, stand], [3.7, stand]],
      draw: (j) => { const g = figure(j);
        return floor() + col + g.far + line(pulley, j.wN, 'rg-cable', 1.3) + g.body + g.near; }};
  }

  // Face pull: rope at face height; pull toward the forehead with the elbows high, squeeze, return.
  {
    const col = `<path class="rg-bench" d="M138 18H150V110H138Z"/>`, pulley = [136, 36];
    const P = base({hip: [64, 63.5], tor: -90, nk: 0, armN: [[81.5, 37.5], [96.5, 37.5]],
      aN: [60, 108.5], aF: [70, 108.5], fN: 0, fF: 0});
    const Q = Object.assign({}, P, {armN: [[52.5, 30.5], [67.5, 22.5]], tor: -92});
    X['face-pull'] = {ar: 4 / 3, keys: [[0, P], [1.0, Q], [1.8, Q], [3.2, P], [3.6, P]],
      draw: (j) => { const g = figure(j);
        return floor() + col + g.far + g.body + line(pulley, j.wN, 'rg-cable', 1.3) + g.near; }};
  }

  // Seated/lying leg curl: lying face down, bend the knees to bring the heels up, lower slowly.
  {
    const bench = `<path class="rg-bench" d="M30 87H128V93H30Z"/><path class="rg-eq" stroke-width="3" d="M40 93V110M118 93V110"/>`;
    const pose = th => base({hip: [72, 81], tor: 0, nk: 8, legN: [180, th], legF: [180, th], fN: th + 270, fF: th + 270,
      wN: [113, 95], wF: [113, 95], ebN: 1, ebF: 1});
    const P = pose(181), Q = pose(298);
    X['leg-curl'] = {ar: 4 / 3, keys: [[0, P], [1.1, Q], [1.6, Q], [3.6, P], [4.0, P]],
      draw: (j) => { const g = figure(j); const v = [j.aN[0] - j.kN[0], j.aN[1] - j.kN[1]], L = Math.hypot(...v);
        const n = [-v[1] / L, v[0] / L]; const pad = add(j.aN, n, -5.2);
        const pivot = [j.kN[0] - 1, j.kN[1] + 6];
        return floor() + bench + g.far + g.body + g.near + line(pivot, pad, 'rg-eq', 2.4) +
          `<circle class="rg-acc" cx="${f(pad[0])}" cy="${f(pad[1])}" r="4.2" fill-opacity=".25" stroke-width="2"/>`; }};
  }

  // Farmer's carry: tall walk with a heavy dumbbell in each hand.
  {
    X['farmer-carry'] = {ar: 4 / 3, T: 1.2, pose: t => {
      const ph = (t % 1.2) / 1.2, hipx = 72, bob = Math.cos(ph * 4 * Math.PI) * 0.9;
      const foot = q => {             // q in [0,1): 0..0.6 on the ground moving back, 0.6..1 swinging forward
        if (q < 0.6) { const u = q / 0.6; return [hipx + 15 - 30 * u, 108.5]; }
        const u = (q - 0.6) / 0.4; return [hipx - 15 + 30 * u, 108.5 - Math.sin(u * Math.PI) * 7];
      };
      const fN = foot(ph), fF = foot((ph + 0.5) % 1);
      return base({hip: [hipx, 64 + bob], tor: -89, wN: [hipx + 1.5, 99 + bob], wF: [hipx + 1.5, 99 + bob], ebN: 1, ebF: 1,
        aN: fN, aF: fF, kbN: -1, kbF: -1, fN: 0, fF: 0});
    }, draw: (j, t) => { const g = figure(j); const off = (t % 1.2) / 1.2 * 30;
      let marks = ''; for (let x = 10 - off; x < 160; x += 30) if (x > 8) marks += `<path class="rg-eq" stroke-width="1.4" d="M${f(x)} 111.5h12"/>`;
      return marks + g.far + dumbbellSide(add(j.wF, [0, 3.5])) + g.body + g.near + dumbbellSide(add(j.wN, [0, 3.5])); }};
  }

  // Pallof press, seen from above: side-on to the cable, press the handle straight out, hold, bring it back.
  {
    X['pallof-press'] = {ar: 4 / 3, top: true,
      keys: [[0, {h: 0}], [1.0, {h: 1}], [3.0, {h: 1}], [4.0, {h: 0}], [4.6, {h: 0}]],
      draw: (_, t, p) => {
        const c = [84, 76], shL = [70, 76], shR = [98, 76];
        const hand = [84, lerp(60, 36, p.h)];
        const pulley = [16, 60];
        const arm = (s) => { const [e, w] = ik(s, hand, 15, 14, s[0] < c[0] ? 1 : -1); return poly([s, e, w], 'rg-near', 5); };
        return `<rect class="rg-mat" x="58" y="62" width="52" height="34" rx="8" fill-opacity=".35" stroke-width="0"/>` +
          `<path class="rg-bench" d="M6 44H16V76H6Z"/>` + line(pulley, hand, 'rg-cable', 1.3) +
          `<path class="rg-far" stroke-width="7" d="M76 92h-4M96 92h-4"/>` +
          line(shL, shR, 'rg-near', 11) + arm(shL) + arm(shR) +
          `<circle class="rg-head" cx="${c[0]}" cy="${c[1]}" r="7.2"/><path class="rg-nose" stroke-width="2.4" d="M84 68.5v-3"/>` +
          `<circle class="rg-acc" cx="${f(hand[0])}" cy="${f(hand[1])}" r="3.2" fill-opacity=".9" stroke-width="0"/>`;
      }};
  }

  function frame(id, t) {
    const x = X[id]; if (!x) return '';
    if (x.top) return x.draw(null, t, sample(x.keys, t));
    const p = x.pose ? x.pose(t) : sample(x.keys, t);
    return x.draw(solve(p), t);
  }
  const STILL = {'bird-dog': 2, 'dead-bug': 1.6, 'hip-flexor': 3, 'hip-thrust': 1.5, 'pull-through': 1.7,
    'face-pull': 1.4, 'leg-curl': 1.3, 'farmer-carry': 0.3, 'pallof-press': 2};
  const still = id => STILL[id] || 0;
  // square crops that frame each figure for the small list tiles
  const BOX = {'bird-dog': '8 22 116 116', 'dead-bug': '10 28 120 120', 'hip-flexor': '12 16 98 98', 'hip-thrust': '6 28 106 106',
    'pull-through': '8 14 98 98', 'face-pull': '50 12 102 102', 'leg-curl': '14 24 118 118', 'farmer-carry': '24 12 100 100',
    'pallof-press': '6 12 108 108'};
  const box = id => BOX[id] || '0 0 160 120';
  const has = id => Object.prototype.hasOwnProperty.call(X, id);
  const ratio = id => (X[id] || {}).ar || 4 / 3;
  return {frame, has, ratio, still, box};
})();

/* ---------- pieces ---------- */
const rigSVG = (v, big) => `<svg class="rig" viewBox="${big ? '0 0 160 120' : RIG.box(v)}" preserveAspectRatio="xMidYMid meet" data-rig="${v}" aria-hidden="true">${RIG.frame(v, RIG.still(v))}</svg>`;
function media(v, big) {
  if (hasVid(v)) return `<video muted playsinline loop preload="none" disablepictureinpicture poster="v/${v}.jpg" data-src="v/${v}.mp4"></video>`;
  if (RIG.has(v)) return rigSVG(v, big);
  return '<span class="ph"><i></i>ویدیو در نسخهٔ بعد</span>';
}
function dots(n, done, id, ctx) {
  let h = '';
  for (let k = 0; k < n; k++) {
    h += `<button class="set${k < done ? ' done' : ''}" data-act="set" data-id="${id}" data-ctx="${ctx}" data-k="${k}" aria-label="ست ${fa(k + 1)}${k < done ? '، انجام شد' : ''}" aria-pressed="${k < done}"></button>`;
  }
  return h;
}
function setsBox(n, id, ctx) {
  return `<div class="sets" data-id="${id}" data-ctx="${ctx}" data-n="${n}" role="group" aria-label="ست‌ها">${dots(n, getDone(ctx, id), id, ctx)}</div>`;
}
function wtBox(id) {
  const w = getW(id);
  return `<label class="wt">وزنه <input type="text" inputmode="decimal" autocomplete="off" data-wt="${id}" value="${w ? fa(w) : ''}" placeholder="—"> کیلو</label>`;
}

  </div>`;
}

/* ---------- videos: play only what is on screen ---------- */
const rigOn = new Set();
let rigRAF = 0;
const calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function rigTick(now) {
  rigRAF = 0;
  if (!rigOn.size) return;
  rigOn.forEach(el => { if (el.isConnected) el.innerHTML = RIG.frame(el.dataset.rig, now / 1000); else rigOn.delete(el); });
  rigRAF = requestAnimationFrame(rigTick);
}
function rigPlay(el) { if (calm) return; rigOn.add(el); if (!rigRAF) rigRAF = requestAnimationFrame(rigTick); }
function rigStop(el) { rigOn.delete(el); }

let io = null;
if ('IntersectionObserver' in window) {
  io = new IntersectionObserver(list => list.forEach(en => {
    const v = en.target;
    if (v.tagName.toLowerCase() === 'svg') { if (en.isIntersecting) rigPlay(v); else rigStop(v); return; }
    if (en.isIntersecting) {
      if (!v.getAttribute('src') && v.dataset.src) v.src = v.dataset.src;
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    } else v.pause();
  }), {threshold: 0.3});
}
function bindVideos() {
  if (io) io.disconnect();
  rigOn.clear();
  const roots = [app]; if (sheet.classList.contains('open')) roots.push(sheet);
  roots.forEach(r => {
    r.querySelectorAll('video').forEach(v => {
      if (io) io.observe(v);
      else { v.src = v.dataset.src; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    });
    r.querySelectorAll('.media svg.rig').forEach(el => { if (io) io.observe(el); else rigPlay(el); });
  });
}

/* ---------- sheet ---------- */
function openSheet(id, ctx) {
  sheet.innerHTML = sheetHTML(id, ctx);
  sheet.classList.add('open');
  sheet.scrollTop = 0;
  document.body.classList.add('lock');
  bindVideos();
  const c = sheet.querySelector('.close'); if (c) c.focus({preventScroll: true});
}
function closeSheet(silent) {
  if (!sheet.classList.contains('open')) return;
  sheet.classList.remove('open');
  document.body.classList.remove('lock');
  sheet.querySelectorAll('video').forEach(v => v.pause());
  sheet.querySelectorAll('svg.rig').forEach(rigStop);
  if (!silent) bindVideos();
}

  setDone(ctx, id, nv);
  document.querySelectorAll(`.sets[data-id="${id}"][data-ctx="${ctx}"]`).forEach(box => {

/* ---------- timer ---------- */
const T = {end: 0, total: 0, label: '', iv: 0, done: false};
const tClock = timerEl.querySelector('.clock'), tLabel = timerEl.querySelector('.lbl'), tProg = timerEl.querySelector('.prog');
const tAdd = $('#tAdd'), tSkip = $('#tSkip');
function startTimer(sec, label) {
  T.total = sec * 1000; T.end = Date.now() + T.total; T.label = label; T.done = false;
  clearInterval(T.iv); T.iv = setInterval(tick, 250);
  timerEl.classList.remove('done'); timerEl.classList.add('show');
  const ctxPlate = (SESSIONS[state.sid] && SESSIONS[state.sid].plate) || (state.view === 'back' ? 'white' : state.view === 'cardio' ? 'gray' : 'white');
  timerEl.setAttribute('style', pv(ctxPlate));
  tick();
}
function addTimer(s) { T.end += s * 1000; T.total += s * 1000; tick(); }
function stopTimer() { clearInterval(T.iv); T.iv = 0; T.end = 0; T.done = false; timerEl.classList.remove('show', 'done'); }
function tick() {
  const left = T.end - Date.now();
  if (left <= 0) {
    if (!T.done) {
      T.done = true; clearInterval(T.iv); T.iv = 0;
      timerEl.classList.add('done'); beep();
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    }
    paint(0); return;
  }
  paint(left);
}
function paint(left) {
  const s = Math.ceil(left / 1000), m = Math.floor(s / 60), r = s % 60;
  tClock.textContent = T.done ? 'تمام' : fa(m + ':' + String(r).padStart(2, '0'));
  tLabel.textContent = T.done ? (T.label === 'استراحت' ? 'استراحت تمام شد؛ ست بعدی' : T.label + ' تمام شد') : T.label;
  tProg.style.transform = 'scaleX(' + (T.total ? Math.max(0, left / T.total) : 0) + ')';
  tAdd.hidden = T.done;
  tSkip.textContent = T.done ? 'باشه' : 'رد کن';
}

/* ---------- sound and screen ---------- */
let ac = null;
function audioUnlock() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function beep() {
  if (!ac) return;
  try {
    const t0 = ac.currentTime + 0.02;
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * 0.28;
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.25);
    }
  } catch (e) {}
}
let wl = null;
async function keepAwake(on) {
  try {
    if (on) {
      if (!wl && 'wakeLock' in navigator) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    } else if (wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (T.end) tick();
    keepAwake(state.tab === 'train' && state.view !== 'home');
  }
});

/* ---------- toast ---------- */
let tt = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ---------- actions ---------- */
function finishSession(sid) {
  const h = hist(); h.push({s: sid, t: Date.now()});
  if (h.length > 500) h.splice(0, h.length - 500);
  S.set('hist', h); stopTimer();
  go({tab: 'train', view: 'home'});
  toast('ثبت شد. جلسهٔ بعدی: ' + SESSIONS[nextSid()].name);
}
function finishBack() {
  const from = state.from;
  stopTimer();
  if (from) go({tab: 'train', view: 'session', sid: from}); else go({tab: 'train', view: 'home'});
  toast('روتین کمر انجام شد');
}
function adjWeek(d) {
  const w = week();
  if (w + d < 1) return;
  S.set('wOff', S.get('wOff', 0) + d);
  render();
}
function resetAll(btn) {
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = 'برای شروع دوباره، یک بار دیگر بزن';
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'شروع دوباره از هفتهٔ ۱'; } }, 4000);
    return;
  }
  ['start', 'wOff', 'hist', 'sets'].forEach(k => S.del(k));
  stopTimer(); go({tab: 'train', view: 'home'});
  toast('برنامه از هفتهٔ ۱ شروع شد');
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  audioUnlock();
  const d = el.dataset;
  switch (d.act) {
    case 'tab': go({tab: d.tab, view: 'home'}); break;
    case 'home': go({tab: 'train', view: 'home'}); break;
    case 'session': go({tab: 'train', view: 'session', sid: d.sid}); break;
    case 'backr': go({tab: 'train', view: 'back', from: d.from || null}); break;
    case 'cardio': go({tab: 'train', view: 'cardio', from: d.from || null}); break;
    case 'up': go(state.from ? {tab: 'train', view: 'session', sid: state.from} : {tab: 'train', view: 'home'}); break;
    case 'ex': openSheet(d.id, d.ctx); break;
    case 'close': closeSheet(); break;
    case 'set': tapSet(d.id, d.ctx, +d.k); break;
    case 'timer': startTimer(+d.sec, d.label || 'استراحت'); break;
    case 't+': addTimer(15); break;
    case 'tskip': stopTimer(); break;
    case 'finish': finishSession(d.sid); break;
    case 'finish-back': finishBack(); break;
    case 'wk-': adjWeek(-1); break;
    case 'wk+': adjWeek(1); break;
    case 'reset': resetAll(el); break;
  }
});
document.addEventListener('input', ev => {
  const i = ev.target.closest && ev.target.closest('input[data-wt]'); if (!i) return;
  setW(i.dataset.wt, i.value);
});
document.addEventListener('change', ev => {
  const i = ev.target.closest && ev.target.closest('input[data-wt]'); if (!i) return;
  const v = setW(i.dataset.wt, i.value);
  document.querySelectorAll(`input[data-wt="${i.dataset.wt}"]`).forEach(x => { x.value = v ? fa(v) : ''; });
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

/* ---------- offline ---------- */
let swOK = false;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try {
    navigator.serviceWorker.register('sw.js').then(() => {
      swOK = true;
      const el = document.getElementById('offline'); if (el) el.textContent = offlineText();
      return navigator.serviceWorker.ready;
    }).then(reg => {
      const urls = []; Object.keys(VIDEOS).forEach(v => urls.push('v/' + v + '.mp4', 'v/' + v + '.jpg'));
      if (reg && reg.active && urls.length) reg.active.postMessage({type: 'precache', urls});
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'precached') {
        S.set('offline', {n: e.data.n, total: e.data.total});
        const el = document.getElementById('offline'); if (el) el.textContent = offlineText();
      }
    });
  } catch (e) {}
}

render();
})();
</script>
</body>
</html>
